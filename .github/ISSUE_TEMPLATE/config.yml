# The two links below are absolute because GitHub's issue-form config accepts
# nothing relative here. They therefore hard-code the slug — if the repository
# is ever renamed or moved to an organisation, these are the lines that break,
# and the first one is the link a security reader clicks.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/snymrova/rampscan/blob/main/SECURITY.md
    about: >-
      Not through an issue. Vulnerabilities in rampscan itself go through the
      process in SECURITY.md, which is private until a fix exists.
  - name: Read the ground rules first
    url: https://github.com/snymrova/rampscan/blob/main/CONTRIBUTING.md
    about: >-
      Most questions about why a recipe, an adjudication or a verdict is shaped
      the way it is are answered by the ten ground rules and the tests that
      enforce them.
