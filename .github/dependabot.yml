# Dependency update automation (plan P3, alongside the test job).
#
# Added because a security tool that lets its own dependencies rot is making an
# argument against itself, and because this repository is about to be public —
# not because `dependency-update-automation` reports it violated. The recipe
# checks for the existence of this file and nothing more; what makes the row
# honest is that the updates it opens actually get looked at.
#
# Note the ordering: dependabot does nothing until a remote exists, so this
# config is inert until P5 and the recipe flips at commit time regardless. That
# gap is the recipe's own stated remainder, not a defect in it.
version: 2
updates:
  # the workflows above pin every action by SHA, which is what
  # `ci-actions-pinned` requires and what makes a pinned action go stale
  # silently. This is the thing that unsticks them.
  #
  # `/` is NOT every action reference in this repository. It covers
  # `.github/workflows/` plus an `action.yml` at the ROOT, and nothing else —
  # so the composite action at `.github/actions/rampscan-check/` was invisible
  # here, and it pins `pnpm/action-setup` and `actions/setup-node` too. #3 and
  # #4 proved it by rebasing onto a main that contained that file and still not
  # touching it. Left unlisted, merging those two would have split each pin in
  # half — new SHA in the workflows, old SHA in the action, and no PR ever
  # again to say so, which is the exact silent staleness this block exists to
  # prevent. Any future composite action needs its directory added here.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/rampscan-check"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 is the native port and no longer exports the compiler API
    # from the package root. `packages/graph/src/extract.ts` has 67 `ts.*` call
    # sites, and the import edges it walks are what `arch-boundaries-hold`
    # asserts over — the recipe that gates every pull request against this
    # repository. #7 went red on both `test` and `console-smoke`, the second at
    # runtime: `ts.forEachChild` was undefined, the graph collector failed, and
    # everything downstream of it unravelled. The migration target is a subpath
    # the vendor itself calls `unstable`, so a gate built on it would move
    # whenever that API moves. This pin moves deliberately or not at all.
    # Unignore when the AST API drops `unstable`, or when the walker goes
    # behind an interface that makes the backend swappable. Diagnosis: #29.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the churn, so it does not drown the bumps that need reading.
      # Majors are excluded deliberately: `dependency-type: development` states
      # where a package sits in package.json, not what breaks if it changes.
      # #26 grouped an `@types/node` bump with vitest 3 -> 4 — the runner that
      # executes all 723 tests, and the thing both CI jobs depend on — under a
      # title naming neither package. Nothing broke, but the grouping did not
      # guarantee that; a hand-read did. Minors and patches only, so anything
      # larger arrives alone and gets read on its own, which is what this
      # comment claimed before it was true. See #28.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
