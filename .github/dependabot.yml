# Dependency update automation (plan P3, alongside the test job).
#
# Added because a security tool that lets its own dependencies rot is making an
# argument against itself, and because this repository is about to be public —
# not because `dependency-update-automation` reports it violated. The recipe
# checks for the existence of this file and nothing more; what makes the row
# honest is that the updates it opens actually get looked at.
#
# Note the ordering: dependabot does nothing until a remote exists, so this
# config is inert until P5 and the recipe flips at commit time regardless. That
# gap is the recipe's own stated remainder, not a defect in it.
version: 2
updates:
  # the workflows above pin every action by SHA, which is what
  # `ci-actions-pinned` requires and what makes a pinned action go stale
  # silently. This is the thing that unsticks them.
  #
  # `/` is NOT every action reference in this repository. It covers
  # `.github/workflows/` plus an `action.yml` at the ROOT, and nothing else —
  # so the composite action at `.github/actions/rampscan-check/` is invisible
  # to this entry, and it pins `pnpm/action-setup` and `actions/setup-node`
  # too. #3 and #4 proved it: rebased onto a main containing that file, they
  # picked up the new `check.yml` and still did not touch the action. Left
  # uncovered, merging them would split each pin in half — new SHA in the
  # workflows, old SHA in the action that runs on every pull request, and no
  # PR ever again to say so.
  #
  # The composite action gets its own entry rather than joining this one in a
  # `directories:` list, and that is deliberate. #22 tried the list, and
  # dependabot keys an open PR to the entry that created it — by ecosystem AND
  # directory — so rewriting `directory: "/"` into `directories: [...]` read as
  # deleting the entry. All four open bumps were disowned with *"the
  # dependabot.yml entry that created this PR has been deleted"* and refused to
  # rebase. Keeping this entry byte-identical is what lets them survive.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # the composite action `check.yml` calls on every pull request. A separate
  # entry, per the note above. Any future composite action needs one too.
  - package-ecosystem: github-actions
    directory: "/.github/actions/rampscan-check"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR for the noisy, low-risk churn; anything else arrives alone and
      # gets read on its own
      dev-dependencies:
        dependency-type: development
