# The gate (plan P6 / N2a): rampscan checks its own pull requests, and says
# what it found in each recipe's own words.
#
# This is the workflow that makes the repository demonstrate itself. Everything
# else a visitor can verify takes twenty minutes of their time and their trust;
# this runs in public, on this repository's own pull requests, where a stranger
# can watch a declared boundary get broken and named.
#
# Three deliberate choices:
#
#   1. A CLEAN PULL REQUEST GETS NO COMMENT. The exit code carries the pass. A
#      green tick posted on every push is the fastest way to teach a reader to
#      scroll past the one comment that mattered, and a stale red comment left
#      behind after a fix is worse — so a run that finds nothing DELETES the
#      comment its predecessor left.
#   2. THE COMMENT IS NEVER THE ONLY OUTPUT. It is also written to the job
#      summary, which needs no token at all. A pull request from a fork gets a
#      read-only token by design, and this workflow degrades to the summary
#      rather than failing on a permission it was never going to have.
#   3. THE JOB FAILS ON WHAT THIS TREE MADE WORSE, not on what it inherited.
#      `rampscan check` exits 1 on ANY would-be violation, which is the right
#      answer to the question a pre-commit hook asks ("would this tree violate?")
#      and the wrong one for a gate: this repository holds `ci-provenance-present`
#      violated BY DECISION — it publishes no artifact, and a provenance step
#      attesting nothing is the vacuous pass ground rule 7 forbids — so failing
#      on any violation would paint every pull request red forever for a debt no
#      pull request created, which is how a gate teaches people to ignore it.
#      Both numbers are stated; the comment names every violated row either way.
name: check

on:
  pull_request:

# least privilege, and rampscan's own ci recipes police this block on the
# self-scan: read the code, write comments, nothing else
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # the dry run reads the WORKING TREE, but the board comparison and the
          # streak are about history — a shallow clone would still answer, and
          # the full one keeps `git status` honest about renames
          fetch-depth: 0

      - id: rampscan
        uses: ./.github/actions/rampscan-check
        with:
          path: .
          # The baseline, and the reason this job can fail at all. `rampscan
          # check` classifies a violation as introduced only against something
          # to compare with, and the ledger — the other candidate — is
          # gitignored and therefore never present in CI. Without this input
          # every violation lands in `unknown`, `would-introduce` is
          # structurally always false, and the gate below is unreachable (#19).
          baseline-ref: ${{ github.event.pull_request.base.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # the token-free surface, always
      - name: write the comment to the job summary
        if: always() && steps.rampscan.outputs.has-comment == 'true'
        run: cat "${{ steps.rampscan.outputs.comment-path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: post or update the pull-request comment
        # a fork's pull request carries a read-only token: there is nothing to
        # try and nothing to apologise for, the summary above already has it
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY_PATH: ${{ steps.rampscan.outputs.comment-path }}
          HAS_COMMENT: ${{ steps.rampscan.outputs.has-comment }}
        run: |
          set -euo pipefail
          # the PREFIX, not the whole marker: the rendered one carries counts
          # (`<!-- rampscan-check introduced=1 inherited=3 -->`), so matching the
          # closing `-->` would find the comment on exactly no pull request
          marker='<!-- rampscan-check'
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)

          if [ "$HAS_COMMENT" != "true" ]; then
            # nothing to say. A comment left over from an earlier push describes
            # a tree that no longer exists, so it goes.
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$existing"
              echo "removed the stale rampscan comment — this tree breaches nothing"
            else
              echo "no violation and no prior comment: nothing to post"
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$BODY_PATH"
            echo "updated the rampscan comment"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$BODY_PATH"
            echo "posted the rampscan comment"
          fi

      - name: fail the job on a boundary this tree breaks
        if: steps.rampscan.outputs.would-introduce == 'true'
        run: |
          echo "::error::rampscan check: this tree introduces or moves a violated row — see the comment"
          exit 1

      - name: note the inherited violations this tree did not cause
        if: steps.rampscan.outputs.would-introduce != 'true' && steps.rampscan.outputs.would-violate == 'true'
        run: |
          echo "::notice::rampscan check: violations exist, and none of them is introduced by this tree"
