# The unit suite and both typechecks, gated on every pull request (plan P3-1).
#
# Why this file exists separately from smoke.yml: until it did, CI ran the
# Playwright console smoke and NOTHING ELSE, so the 695 tests the README quotes
# were ungated in the one place a stranger can check. A quality claim nobody
# enforces is a quality claim, not a quality gate.
#
# It installs no tool binaries and pulls no images. Every test here runs against
# fixtures and temp directories, so this job is minutes rather than tens of
# minutes, and it is the one that should fail first when something is wrong.
name: test

on:
  push:
    branches: [main]
  pull_request:

# rampscan's own recipes police this file when the repo self-scans:
# ci-actions-pinned wants SHA pins, checkov wants least-privilege permissions
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the workspace projects — root `tsc --build` walks the ten packages and
      # does NOT reach console/web, which is a Next app with its own tsconfig
      - run: pnpm typecheck

      - name: typecheck the console
        run: pnpm --filter @rampscan/console-web typecheck

      # unit + e2e, the whole suite; several tests build the fixture repos and
      # assert on their SHAs, so no test tool needs to be on PATH here
      - run: pnpm test

      # Q5.2 — the package conformance check (G10, `FRC-CSO-JSN`) walked end to
      # end through the CLI, over THIS repository's own declared offering. A
      # nonconforming certification document fails our build, and never a
      # client's.
      #
      # WHAT THIS STEP GATES, STATED HONESTLY — because the obvious reading is
      # wrong. CI has no ledger (it is gitignored and nothing here builds one),
      # so the fold is empty and the computed half of both documents is zeros;
      # `pnpm test` above is what validates a populated computed half, over a
      # fixture register and against the same pinned bytes.
      #
      # And the declared half is NOT merely "the part a human edits": zod's
      # `OfferingConfig` deliberately mirrors the FedRAMP schema's own
      # constraints — the Sales contact, the phone pattern, the six-digit
      # assessorID, the gated-repository if/then — so that a typo fails one
      # layer closer to the person who can fix it. A config that parses is
      # therefore ALREADY most of the way to a conforming document.
      #
      # What is left, and why this step is not ceremony, is the DIVERGENCE
      # between that hand-written mirror and the schema it mirrors. The mirror
      # is maintained by hand against a PINNED draft; the pin will bump. Today
      # `businessCategory` is the live example — zod takes any non-empty string,
      # the FedRAMP schema takes one of thirty-six enum values — so a config
      # declaring a category FedRAMP does not list parses clean and produces a
      # document that fails here. `fedramp-conformance.test.ts` pins exactly
      # that case, so this step is provably able to fail (ground rule 7).
      #
      # It runs as two commands rather than one because they fail differently
      # and a reader should be able to tell which: `exports` exits 1 on bytes it
      # just generated, `conformance` exits 1 on bytes it just read — including
      # on a document whose own conformance stamp no longer matches a fresh
      # validation, which is the failure a regeneration can never surface.
      - name: package conformance check (FRC-CSO-JSN) over our own exports
        run: |
          set -euo pipefail
          pnpm rampscan exports --ledger "$RUNNER_TEMP/absent-ledger" --out "$RUNNER_TEMP/conformance"
          pnpm rampscan conformance "$RUNNER_TEMP/conformance/exports"
