# The synthetic machine-readable package for the package adapter (SPEC §12.8,
# plan S3-1): the assessed-package shape observed in docs/RESEARCH-PARAMIFY-PILOT.md
# §2 (Package → Assessment → KSIs → Validations → Evidences → Artifacts),
# written by us — shapes only, no content reuse. The KSI ids are the Phase One
# numbered form on purpose, so ingesting it exercises the crosswalk
# (recipes/crosswalks/ksi-phase-one-to-2026.07.14.01.json):
#
#   CNA-01  one Phase One KSI → one 2026 KSI; two evidences, one of them a
#           script-produced export the package marks `automated: Yes`, the
#           other a screenshot; a third evidence repeats the first's name, so
#           the adapter's recipe-id suffixing is exercised
#   PIY-06  one Phase One KSI → TWO 2026 KSIs (executive support and
#           investments were split); one evidence, so two submissions
#   SVC-07  a Phase One KSI with NO 2026 successor (patching left the KSI
#           catalog for FRR-VDR); skipped and named, never a bundle
#   IAM-01  assessed `Partial`, one evidence whose artifact is named without
#           a reference and carries no date, so the timestamp falls back to
#           the assessment's date
#
# Every signature field is empty, as in the assessed package this shape was
# read from; nothing here is a verdict the appliance signs — see §12.8.
Package:
  CSPName: Synthetic CSP
  CSO: Synthetic Offering
  impact: Low
  summaryOfCSO: A synthetic cloud service offering that exists only to exercise the package adapter.
  Assessments:
